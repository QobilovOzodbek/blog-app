{% extends 'base.html' %}
{% load static %}

{% block title %}Home | Blog{% endblock %}

{% block content %}
<div class="container">

    <!-- SEARCH BAR -->
    <input type="text" id="search" class="search-box" placeholder="Teglar bo‘yicha qidirish..." onkeyup="filterCards()">

    <!-- POSTS GRID -->
    <div class="cards" id="cardList">
        {% for post in posts %}
        <a href="{{ post.get_absolute_url }}" class="card"
            data-tags="{% for t in post.tags.all %}{{ t.name|lower }} {% endfor %}">
            <img src="{{ post.image.url }}" alt="image">
            <div class="card-content">
                <h3>{{ post.title }}</h3>
                <p>{{ post.short_text }}</p>

                <div class="tags">
                    {% for tag in post.tags.all %}
                    <span class="tag">{{ tag.name }}</span>
                    {% endfor %}
                </div>
            </div>
        </a>
        {% endfor %}
    </div>

</div>

<script>
    function filterCards() {
        let input = document.getElementById('search').value.toLowerCase();
        let cards = document.getElementById('cardList').getElementsByClassName('card');

        for (let i = 0; i < cards.length; i++) {
            let card = cards[i];
            let tags = card.dataset.tags.toLowerCase();
            let title = card.querySelector('h3').textContent.toLowerCase();
            let shortText = card.querySelector('p').textContent.toLowerCase();

            if (tags.includes(input) || title.includes(input) || shortText.includes(input)) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        }
    }
</script>

{% endblock %}
